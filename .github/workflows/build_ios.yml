name: Build Flutter iOS IPA

on:
  push:
    branches: [ main ] # Ou master selon ta branche principale

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Mets ta version de Flutter si besoin (ex: 3.19.0)
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (Profile Non-Signé)
        run: flutter build ios --profile --no-codesign

      - name: Zip Runner.app for Sideloadly
        run: |
          cd build/ios/iphoneos
          zip -r Runner.zip Runner.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: build/ios/iphoneos/Runner.zip
